name: heartbeat
# Timer for the private flat search (luca1997sb/liveinzh), because GitHub's own
# schedule never fires there. Each run waits 20 minutes in the "wait" environment
# (5 minutes in "wait5" on weekdays 17:20-17:59 Zurich time, around immomailing's 17:30 send)
# (a wait timer uses no runner minutes), pushes an empty commit to the search repo's
# "heartbeat" branch, which starts the search, and then starts the next heartbeat.
# Searches only 05:00-22:59 UTC; at night it just keeps ticking.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"   # restarts the chain should it ever stop

concurrency:
  group: heartbeat
  cancel-in-progress: false

permissions:
  actions: write

jobs:
  pick:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      env: ${{ steps.p.outputs.env }}
    steps:
      - id: p
        run: |
          now=$(( 10#$(TZ=Europe/Zurich date +%H) * 60 + 10#$(TZ=Europe/Zurich date +%M) ))
          if (( $(TZ=Europe/Zurich date +%u) <= 5 && now >= 1040 && now < 1080 )); then
            echo env=wait5 >> "$GITHUB_OUTPUT"
          else
            echo env=wait >> "$GITHUB_OUTPUT"
          fi
  tick:
    needs: pick
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: ${{ needs.pick.outputs.env }}
    steps:
      - name: Start the search
        continue-on-error: true
        env:
          KEY: ${{ secrets.LIVEINZH_KEY }}
        run: |
          (( 10#$(date -u +%H) >= 5 && 10#$(date -u +%H) <= 22 )) || exit 0
          mkdir -p ~/.ssh && umask 077
          printf '%s\n' "$KEY" > ~/.ssh/tick
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/tick -o IdentitiesOnly=yes"
          git init -q r && cd r
          git fetch -q --depth 1 --filter=blob:none git@github.com:luca1997sb/liveinzh.git main
          tick=$(git -c user.name=liveinzh -c user.email=liveinzh@users.noreply.github.com \
            commit-tree 'FETCH_HEAD^{tree}' -p FETCH_HEAD -m tick)
          git push -q -f git@github.com:luca1997sb/liveinzh.git "$tick:refs/heads/heartbeat"
      - name: Next heartbeat
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run heartbeat.yml --repo "$GITHUB_REPOSITORY"
